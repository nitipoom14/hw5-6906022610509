<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURA Acoustics | Products</title>
<link rel="stylesheet" href="css/gridstyle.css" />
</head>
<body>

<div class="page">

  
  <header class="site-header">
    <img src="images/header.jpg" alt="AURA Acoustics" />
  </header>

  
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="product.html" class="active">Products</a>
  </nav>

  
  <main class="main-grid">

    
    <section class="content-col">

      <article class="card">
        <h2>Our Catalog</h2>
        <p class="card-sub">Browse products and details below.</p>
        <div class="media">
          <img src="images/product1.jpg" alt="AURA Wireless Headphones" />
        </div>
      </article>

      <article class="card">
        <h2>Product Name</h2>
        <p class="card-sub">Short description, price, and actions (add to cart, view details).</p>
        <div class="media">
          <img src="images/product2.jpg" alt="AURA Headphones lifestyle shot" />
        </div>
      </article>

    </section>

    
    <aside class="sidebar">
      <h2>สมัครสมาชิก</h2>

      <form class="form-grid" action="#" method="post">

        <div class="field">
          <label for="firstname">ชื่อ</label>
          <input type="text" id="firstname" name="firstname" placeholder="ชื่อจริง" required />
        </div>

        <div class="field">
          <label for="lastname">นามสกุล</label>
          <input type="text" id="lastname" name="lastname" placeholder="นามสกุล" required />
        </div>

        <div class="field">
          <label for="email">อีเมล</label>
          <input type="email" id="email" name="email" placeholder="example@domain.com" required />
        </div>

        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" name="password" placeholder="อย่างน้อย 8 ตัวอักษร" required />
        </div>

        <div class="field">
          <label for="confirm-password">ยืนยันรหัสผ่าน</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="ยืนยันรหัสผ่าน" required />
        </div>

        <div class="field">
          <label for="phone">เบอร์โทรศัพท์</label>
          <input type="tel" id="phone" name="phone" placeholder="083-xxx-xxxx" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" />
        </div>

        <div class="field">
          <label>เพศ</label>
          <div class="radio-row">
            <label><input type="radio" name="gender" value="male" /> ชาย</label>
            <label><input type="radio" name="gender" value="female" /> หญิง</label>
            <label><input type="radio" name="gender" value="unspecified" checked /> ไม่ระบุ</label>
          </div>
        </div>

        <div class="field">
          <div class="checkbox-row">
            <label><input type="checkbox" name="subscribe" value="news" /> รับข่าวสาร</label>
            <label><input type="checkbox" name="subscribe" value="promo" /> โปรโมชั่น</label>
            <label><input type="checkbox" name="subscribe" value="event" /> กิจกรรม</label>
          </div>
        </div>

        <div class="field">
          <label for="member-type">ประเภทสมาชิก</label>
          <select id="member-type" name="member-type">
            <option value="normal" selected>ธรรมดา (Normal)</option>
            <option value="vip">VIP</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <div class="field terms">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">ยอมรับข้อกำหนดและเงื่อนไข</label>
        </div>

        <button type="submit" class="submit-btn">สมัครสมาชิก</button>

        <a href="#" class="member-link">ตรวจสอบข้อมูลของคุณในภายหลัง</a>

      </form>
    </aside>

  </main>

  
  <footer class="site-footer">
    <img src="images/footer.jpg" alt="AURA Acoustics Footer" />
  </footer>

</div>

</body>
</html>
